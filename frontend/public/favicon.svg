<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="pin-grad" x1="256" y1="100" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Location Pin Container -->
  <g filter="url(#shadow)">
    <!-- GPS Location Pin -->
    <path d="M256 96 C185.3 96 128 153.3 128 224 C128 312 256 416 256 416 C256 416 384 312 384 224 C384 153.3 326.7 96 256 96 Z" fill="url(#pin-grad)" />
    
    <!-- Inner Pin Center Hole -->
    <circle cx="256" cy="224" r="54" fill="#1E1B4B" />
    
    <!-- Center Pulse / Satellite dot -->
    <circle cx="256" cy="224" r="22" fill="#6366F1" />
  </g>
  
  <!-- Active Verified Check Badge -->
  <g transform="translate(320, 320)">
    <circle cx="48" cy="48" r="48" fill="#10B981" stroke="#FFFFFF" stroke-width="8" />
    <path d="M30 48 L42 60 L68 34" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
